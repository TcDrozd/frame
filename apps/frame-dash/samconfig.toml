# default/prod remain production aliases; never repoint them to a dev key.
# Use scripts/deploy_stack.sh; direct `sam deploy` bypasses the local intent gate.
version = 0.1

[default.global.parameters]
stack_name = "frame-dash"
region = "us-east-1"
profile = "frame-dash-deploy"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "ManifestKey=manifest.json"

[prod.global.parameters]
stack_name = "frame-dash"
region = "us-east-1"
profile = "frame-dash-deploy"

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "ManifestKey=manifest.json"

# Not provisioned. Requires a separately approved private bucket and scoped IAM
# profile; never substitute the production bucket/profile to make deploy work.
[staging.global.parameters]
stack_name = "frame-dash-staging"
region = "us-east-1"
profile = "frame-dash-staging-deploy"

[staging.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = [
  "Environment=staging",
  "PhotosBucketName=frame-dash-staging-photos-084683516815",
  "PhotosPrefix=photos/",
  "ManifestKey=staging/manifest.json",
  'LegacyManifestKey=""',
  "CognitoDomainPrefix=frame-dash-staging-084683516815",
  "ScheduleState=DISABLED",
  'ScheduleExpression="rate(2 hours)"',
  "AutoPublishMode=off",
  "AutoWindowSize=50",
  "PhotoUrlMode=presign",
  'CloudFrontPublicKeyPem=""',
  "PrivateKeySsmName=/frame-dash-staging/cf-signing-key",
  "PresignExpirySeconds=21600",
  "SignedUrlTtlSeconds=7776000",
]
